<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 100px;
            height: 100vh;
        }
        .card{
            width: 200px;
            height: 200px;
            background-color: lightskyblue;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .sale{
            width: 70px;
            height: 45px;
            background-color: lightskyblue;
            position: absolute;
            top: -15px;
            border-radius: 20px 20px 0 0;

        }
        .sale1{width: 70px;
            height: 45px;
            background-color: lightskyblue;
            position: absolute;
            bottom: -15px;
            border-radius: 0 0 20px 20px;
        }

    </style>
</head>
<body>
<div class="card">
    <div class="sale"></div>
    <p>Lorem ipsum.</p>
    <p>Lorem ipsum.</p>
    <p>Lorem ipsum.</p>
    <div class="sale1"></div>
</div>
</body>
</html>
