<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
  <style>
    .wrapper {
      height: 100vh;
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
    }
    .item{
      width: 200px;
      height: 200px;
      background: rgb(77,11,121);
      background: linear-gradient(90deg, rgba(77,11,121,1) 0%, rgba(111,6,17,1) 50%, rgba(9,6,1,1) 100%);
      box-shadow: 10px 10px 148px 55px rgba(84,24,6,0.99);
      border-radius: 50%;
      border: 3px solid rgb(77,11,121);
      transition: all 1s;
      display: flex;
      align-items: center;
      justify-content: center;

    }
    .item a{
      text-decoration: none;
      color: white;
    }
    .item:hover{
      border-radius: 0;
      border: 4px double rgba(111,6,17,1);
      transition: all 1s;
      /*width: 300px;*/
      /*height: 300px;*/
      transform: scale(2);

    }
    .item:hover a{
      color: deeppink;
    }

  </style>
</head>
<body>
<div class="wrapper">
  <div class="item"></div>
  <div class="item"></div>
  <div class="item">
    <a href="#">link</a>
  </div>
  <div class="item"></div>
  <div class="item"></div>
  <div class="item"></div>
  <div class="item"></div>
  <div class="item"></div>
  <div class="item"></div>
  <div class="item"></div>
</div>

</body>
</html>
