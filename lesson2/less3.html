<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }
        body{
            height: 100vh;
        }
        .box {
            width: 200px;
            height: 200px;

        }
        .black{
            background-color: black;
        }
        .red{
            background-color: darkred;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .pink{
            background-color: hotpink;
        }
        .flex{
            height: 100%;
            background-color: bisque;
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
            flex-direction: column-reverse;
        }
        .red p{
            text-align: center;

        }
        .red img{
            width: 70%;
        }
    </style>
</head>
<body>

<div class="flex">
    <div class="box black"></div>
    <div class="box red">
        <p>Rin tired so much</p>
        <img src="https://rhealthc.com/wp-content/uploads/2024/01/Functional-Medicine-and-Mental-Health-How-Does-It-Help-Treat-Anxiety-and-Depression.jpg">
    </div>
    <div class="box pink"></div>
</div>

</body>
</html>
