<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        label{
            display: block;
            margin: 10px;
        }
        form sup{
            color: red;
        }
        textarea {
            resize: none;
            width: 150px;
        }

        .form_register{
            border: 3px solid lightseagreen;
            width: 30%;
            border-radius: 20px;
            padding: 50px;
        }
        input[type="text"]{
            background-color: bisque;
            border: 3px solid lightseagreen;
            border-radius: 20px;
            color: blueviolet;
        }
        /*input[type="text"]::placeholder{*/
        /*    background-color: bisque;*/
        /*    border: 3px solid lightseagreen;*/
        /*    border-radius: 20px;*/
        /*    color: blueviolet;*/
        /*}*/
        input[type="text"]:focus{
            outline: 1px solid lawngreen;
        }
    </style>
</head>
<body>
<form class="form_register">
    <label for="first_name">First Name</label>
    <input type="text" name="name" id="first_name" placeholder="Enter your name " required> <sup>*</sup>

    <label for="email">Email</label>
    <input type="email" name="email" id="email" placeholder="Enter your email " required> <sup>*</sup>

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="Enter your password " required> <sup>*</sup>

    <label for="age">Your age</label>
    <input type="number" name="age" id="age" min="18" max="100">

    <label>Gender</label>
    <label><input type="radio" name="gender" value="male">Male</label>
    <label><input type="radio" name="gender" value="female">Female</label>

    <label>
        <input type="checkbox" name="newsletter">Get our newsletter?
    </label>

    <label>Country</label>
    <select name="country" id="country">
        <option value="">Choose country</option>
        <option value="australia">Australia</option>
        <option value="canada">Canada</option>
        <option value="usa">USA</option>
        <option value="ukraine">Ukraine</option>
    </select>

    <label></label>
    <select id="phone">
        <optgroup label="Iphone">
            <option value="17">Iphone17</option>
            <option value="16">Iphone16</option>
            <option value="15">Iphone15</option>
        </optgroup>
        <optgroup label="Samsung">
            <option value="S23">SamsungS23</option>
            <option value="S24">SamsungS24</option>
            <option value="S25">SamsungS25</option>

        </optgroup>
    </select>

    <label for="message"></label>
    <textarea name="message" id="message" cols="30" rows="10"></textarea>

    <div class="button">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </div>



</form>
</body>
</html>
