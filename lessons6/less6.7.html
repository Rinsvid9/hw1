<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .yes{
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid black;
            margin-bottom: 0;
            border-radius: 2px;
        }
        .yes:checked{
            background-color: firebrick;
            background-image: url("https://img.icons8.com/cute-clipart/64/pusheen--v1.png");
            background-size: cover;
        }

        input[type="radio"]{
            appearance: none;
            width: 20px;
            height: 20px;
            border: 1px solid black;
            margin-bottom: 0;
            border-radius: 50%;
        }
        input[type="radio"]:checked{
            background-color: firebrick;
            background-image: url("https://img.icons8.com/cute-clipart/64/pusheen--v1.png");
            background-size: cover;
        }
    </style>
</head>
<body>
<div>
    <label>Gender</label>
    <label><input type="radio" name="gender" value="male">Male</label>
    <label><input type="radio" name="gender" value="female">Female</label>

    <label>
        <input type="checkbox" name="news" class="yes">Other
    </label>
</div>
</body>
</html>
