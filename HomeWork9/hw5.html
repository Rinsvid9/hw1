<!DOCTYPE html>
<html lang="en">
<head>
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }

        .wrap{
            display: grid;
            height: 100vh;
            grid-template-columns: 1fr 1fr 1.4fr;
            grid-template-rows: 0.2fr 1.5fr 1.5fr 0.4fr;
            grid-template-areas:
            "header header header"
            "first second third"
            "first second four"
            "footer footer footer";
        }

        header{
            grid-area: header;
            background: #D9D9D9;
        }

        .first{
            grid-area: first;
            background: #A4A4A4;
        }
        .second{
            grid-area: second;
            background: #C1C1C1;
        }

        .third{
            grid-area: third;
            background: #7F7A7A;
        }
        .four{
            grid-area: four;
            background: #6B6161;
        }

        footer{
            grid-area: footer;
            background: #D9D9D9;
        }

    </style>
</head>
<body>
<div class="wrap">
    <header></header>
    <section class="first"></section>
    <section class="second"></section>
    <aside class="third"></aside>
    <aside class="four"></aside>
    <footer></footer>
</div>

</body>
</html>
