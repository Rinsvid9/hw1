<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
        }

        .wrapper {
            display: grid;
            height: 100vh;
            grid-template-columns: 1fr 1.5fr 1fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            grid-template-areas:
            "header header header"
            "left top right "
            "left bottom  right "
            "footer footer footer";
        }

        header{
            grid-area: header;
            background: #D9D9D9;
        }
        .left{
            grid-area: left;
            background: #C0BDBD;
        }
        .top{
            grid-area: top;
            background: #827878;
        }
        .bottom{
            grid-area: bottom;
            background: #B7ADAD;
        }

        .right{
            grid-area: right;
            background: #C0BDBD;;
        }

        footer{
            grid-area: footer;
            background: #D9D9D9;
        }

    </style>
</head>
<body>
<div class="wrapper">
    <header></header>
    <aside class="left"></aside>
    <section class="top"></section>
    <section class="bottom"></section>
    <aside class="right"></aside>
    <footer></footer>
</div>

</body>
</html>
