<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: lightpink ;
        }
        .anima{
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 150px auto;
            animation: run 8s linear alternate;
        }
        .anima img{
            width: 300px;
            height: auto;
        }

        @keyframes run {
            0%{opacity: 0;
                transform: rotate(180deg);
            }
            40%{opacity: 0.4;
                transform:  scale(0.5);
            }
            60%{opacity: 0.7;
                transform: rotate(-90deg) scale(0.7);

            }
            80%{opacity: 0.8;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
<div class="anima">
    <img src="unnamed.png" alt="camera">
</div>
</body>
</html>
